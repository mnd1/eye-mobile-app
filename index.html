<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EYE Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101012;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    h1 span {
      color: #ef233c;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #1b1b1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 22px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #111114;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #ef233c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #invoiceStatus {
      margin-top: 20px;
      padding: 15px;
      min-height: 55px;
      background: #111114;
      border: 1px dashed #555;
      border-radius: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1><span>EYE</span> Mobile</h1>
  <div class="subtitle">نظام إدارة قطع غيار الهواتف</div>

  <div class="card">

    <h2>إدخال فاتورة من صورة</h2>

    <label for="invoiceImage">صورة الفاتورة</label>
    <input
      id="invoiceImage"
      type="file"
      accept="image/*"
    >

    <button id="invoiceButton" type="button">
      معالجة الفاتورة
    </button>

    <div id="invoiceStatus">
      اختر صورة فاتورة ثم اضغط معالجة الفاتورة.
    </div>

  </div>

</div>

<script>
const button = document.getElementById("invoiceButton");
const fileInput = document.getElementById("invoiceImage");
const statusBox = document.getElementById("invoiceStatus");

button.addEventListener("click", processInvoice);

async function processInvoice() {

  const file = fileInput.files[0];

  if (!file) {
    statusBox.textContent = "اختر صورة الفاتورة أولاً.";
    return;
  }

  statusBox.textContent = "جاري قراءة الفاتورة...";

  try {

    const image = await file.arrayBuffer().then(buffer => {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return `data:${file.type};base64,${btoa(binary)}`;
});

    statusBox.textContent = "جاري إرسال الفاتورة إلى الخادم...";

    const response = await fetch("/api/invoice", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: image
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "حدث خطأ في الخادم"
      );
    }

    statusBox.textContent =
      data.message ||
      data.text ||
      "تمت معالجة الفاتورة بنجاح.";

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "خطأ: " + error.message;
  }
}

function fileToDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = () =>
      reject(new Error("تعذر قراءة صورة الفاتورة"));

    reader.readAsDataURL(file);
  });
}
</script>

</body>
</html>
