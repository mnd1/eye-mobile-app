<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYE Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      
    }

    body {
      margin: 0;
      background: #101012;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 46px;
      font-weight: bold;
      direction: ltr;
    }

    .eye {
      color: #ff233d;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 20px;
      margin-bottom: 45px;
    }

    .card {
      background: #1a1a1d;
      border: 1px solid #38383d;
      border-radius: 24px;
      padding: 24px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 10px 0 35px;
    }

    label {
      display: block;
      font-size: 19px;
      margin-bottom: 12px;
    }

    input[type="file"] {
      width: 100%;
      padding: 18px;
      border: 2px solid #3d3d43;
      border-radius: 16px;
      background: #101012;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 20px;
      border: 0;
      border-radius: 16px;
      background: #ff233d;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    #status {
      margin-top: 25px;
      padding: 20px;
      border: 1px dashed #555;
      border-radius: 16px;
      text-align: center;
      line-height: 1.7;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .invoice-info {
      background: #141416;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 22px;
      line-height: 2;
    }

    .invoice-info strong {
      color: #ff5063;
    }

    .items-title {
      font-size: 25px;
      font-weight: bold;
      margin: 25px 0 15px;
    }

    .item {
      background: #141416;
      border: 1px solid #343439;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .item-number {
      color: #ff5063;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .model {
      font-size: 21px;
      font-weight: bold;
      direction: ltr;
      text-align: right;
      overflow-wrap: anywhere;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-top: 1px solid #2e2e32;
      padding: 10px 0;
    }

    .row span:first-child {
      color: #aaa;
    }

    .summary {
      background: #211518;
      border: 1px solid #71303a;
      border-radius: 18px;
      padding: 18px;
      margin-top: 25px;
      line-height: 2;
      font-size: 18px;
    }

    .error {
      color: #ff7888;
    }

    @media (max-width: 500px) {
      .logo {
        font-size: 40px;
      }

      h1 {
        font-size: 28px;
      }

      .card {
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <span class="eye">EYE</span> Mobile
    </div>

    <div class="subtitle">
      نظام إدارة قطع غيار الهواتف
    </div>

    <div class="card">

      <h1>إدخال فاتورة من صورة</h1>

      <label for="invoiceFile">صورة الفاتورة</label>

      <input
        id="invoiceFile"
        type="file"
        accept="image/*"
      >

      <button id="processBtn">
        معالجة الفاتورة
      </button>

      <div id="status">
        اختر صورة فاتورة ثم اضغط معالجة الفاتورة.
      </div>

      <div id="result">

        <div id="invoiceInfo" class="invoice-info"></div>

        <div class="items-title">
          الأصناف
        </div>

        <div id="items"></div>

        <div id="summary" class="summary"></div>
<button id="saveInvoiceBtn" type="button" style="display:none;">💾 حفظ الفاتورة</button>
      </div>

    </div>
  </div>

<script>
  const fileInput = document.getElementById("invoiceFile");
  const button = document.getElementById("processBtn");
  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");
  const invoiceInfo = document.getElementById("invoiceInfo");
  const itemsBox = document.getElementById("items");
  const summaryBox = document.getElementById("summary");
  const saveInvoiceBtn = document.getElementById("saveInvoiceBtn");
let currentInvoice = null;
  function safe(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "غير محدد";
    }

    return String(value);
  }

  function escapeHtml(value) {
    return safe(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function readFileAsDataURL(file) {
  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);

  let binary = "";
  const chunkSize = 0x8000;

  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
  }

  return `data:${file.type || "image/jpeg"};base64,${btoa(binary)}`;
}

  function showInvoice(invoice) {

    invoiceInfo.innerHTML = `
      <div>
        <strong>المورد:</strong>
        ${escapeHtml(invoice.supplier)}
      </div>

      <div>
        <strong>الاسم الظاهر:</strong>
        ${escapeHtml(invoice.invoice_name)}
      </div>

      <div>
        <strong>التاريخ:</strong>
        ${escapeHtml(invoice.date)}
      </div>

      <div>
        <strong>العملة:</strong>
        ${escapeHtml(invoice.currency)}
      </div>
    `;

    itemsBox.innerHTML = "";

    const items = Array.isArray(invoice.items)
      ? invoice.items
      : [];

    items.forEach((item, index) => {

      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <div class="item-number">
          الصنف ${index + 1}
        </div>

        <div class="model">
          ${escapeHtml(item.model)}
        </div>

        <div class="row">
          <span>الماركة</span>
          <strong>${escapeHtml(item.brand)}</strong>
        </div>

        <div class="row">
          <span>الكمية</span>
          <strong>${escapeHtml(item.quantity)}</strong>
        </div>

        <div class="row">
          <span>سعر الوحدة</span>
          <strong>${escapeHtml(item.unit_price)}</strong>
        </div>

        <div class="row">
          <span>المجموع</span>
          <strong>${escapeHtml(item.total)}</strong>
        </div>
      `;
      

      itemsBox.appendChild(div);
    });

    summaryBox.innerHTML = `
      <div>
        <strong>عدد الأصناف:</strong>
        ${items.length}
      </div>

      <div>
        <strong>إجمالي الكمية:</strong>
        ${escapeHtml(invoice.total_quantity)}
      </div>

      <div>
        <strong>الإجمالي العام:</strong>
        ${escapeHtml(invoice.grand_total)}
      </div>

      <div>
        <strong>العملة:</strong>
        ${escapeHtml(invoice.currency)}
      </div>
    `;

    resultBox.style.display = "block";
  }

  button.addEventListener("click", async () => {

    const file = fileInput.files[0];

    if (!file) {
      statusBox.innerHTML =
        '<span class="error">اختر صورة الفاتورة أولاً.</span>';
      return;
    }

    button.disabled = true;
    resultBox.style.display = "none";

    statusBox.textContent =
      "جاري قراءة الفاتورة... الرجاء الانتظار.";

    try {

      const image = await readFileAsDataURL(file);

      const response = await fetch("/api/invoice", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          image
        })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "حدث خطأ أثناء معالجة الفاتورة"
        );
      }

      if (!data.invoice) {
        throw new Error(
          "لم يتم استلام بيانات الفاتورة"
        );
      }

      statusBox.textContent =
        "تمت قراءة الفاتورة بنجاح.";

      showInvoice(data.invoice);
currentInvoice = data.invoice;
saveInvoiceBtn.style.display = "block";
    } catch (error) {

      console.error(error);

      statusBox.innerHTML =
        '<span class="error">' +
        escapeHtml(error.message) +
        '</span>';

    } finally {

      button.disabled = false;

    }
  });
 saveInvoiceBtn.addEventListener("click", async () => {
  if (!currentInvoice) {
    statusBox.textContent = "لا توجد فاتورة لحفظها";
    return;
  }

  saveInvoiceBtn.disabled = true;
  statusBox.textContent = "جاري حفظ الفاتورة...";

  try {
    const response = await fetch("/api/save-invoice", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ invoice: currentInvoice })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "فشل حفظ الفاتورة");
    }

    statusBox.textContent = "✅ تم حفظ الفاتورة بنجاح";
  } catch (error) {
    console.error(error);
    statusBox.textContent = "❌ " + error.message;
  } finally {
    saveInvoiceBtn.disabled = false;
  }
}); 
</script>

</body>
</html>
